<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0708">
  <title>¿A qué clases vienes? · On Stage</title>
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <div class="envoltorio">
    <header class="cabecera">
      <p class="marca">On Stage · Bailes Latinos</p>
      <h1 class="titulo" id="titulo">Horarios</h1>
      <p class="subtitulo" id="saludo">Cargando…</p>
      <div class="regla"></div>
    </header>

    <nav class="dias" id="dias" aria-label="Elegir día"></nav>

    <main id="contenido" class="cargando">Cargando horario…</main>
  </div>

  <div class="barra" id="barra" hidden>
    <div class="barra-interior">
      <span class="contador" id="contador"></span>
      <button class="boton" id="confirmar">Confirmar</button>
    </div>
  </div>

  <script src="/static/alumno.js"></script>
</body>
</html>
