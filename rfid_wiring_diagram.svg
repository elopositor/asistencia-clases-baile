<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo -->
  <rect width="1200" height="800" fill="#f8f9fa"/>

  <!-- Título -->
  <text x="600" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    RC522 → Raspberry Pi Pico W
  </text>

  <!-- Advertencia voltaje -->
  <rect x="50" y="60" width="500" height="50" fill="#fff3cd" stroke="#ff9800" stroke-width="2" rx="4"/>
  <text x="70" y="95" font-size="14" font-weight="bold" fill="#ff6b00">
    ⚠ 3.3V SOLAMENTE — Nunca 5V (se estropea el RC522)
  </text>

  <!-- ============ RC522 ============ -->
  <g id="rc522">
    <!-- Cuerpo del módulo -->
    <rect x="100" y="150" width="280" height="500" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>

    <!-- Título -->
    <text x="240" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      RC522 RFID
    </text>

    <!-- Tira de pines (la que hay que soldar) -->
    <rect x="320" y="200" width="30" height="420" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
    <text x="360" y="225" font-size="12" font-weight="bold" fill="#d32f2f">← SOLDAR</text>
    <text x="360" y="240" font-size="11" fill="#d32f2f">esta tira</text>

    <!-- Pines (de arriba a abajo) -->
    <circle cx="320" cy="210" r="4" fill="#ffc107"/>
    <text x="130" y="215" font-size="12" font-weight="bold" fill="#333">SDA (SS)</text>
    <line x1="310" y1="210" x2="190" y2="210" stroke="#ffc107" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="260" r="4" fill="#4caf50"/>
    <text x="130" y="265" font-size="12" font-weight="bold" fill="#333">SCK</text>
    <line x1="310" y1="260" x2="190" y2="260" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="310" r="4" fill="#2196f3"/>
    <text x="130" y="315" font-size="12" font-weight="bold" fill="#333">MOSI</text>
    <line x1="310" y1="310" x2="190" y2="310" stroke="#2196f3" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="360" r="4" fill="#9c27b0"/>
    <text x="130" y="365" font-size="12" font-weight="bold" fill="#333">MISO</text>
    <line x1="310" y1="360" x2="190" y2="360" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="410" r="4" fill="#000"/>
    <text x="130" y="415" font-size="12" font-weight="bold" fill="#333">GND</text>
    <line x1="310" y1="410" x2="190" y2="410" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="460" r="4" fill="#ff5722"/>
    <text x="130" y="465" font-size="12" font-weight="bold" fill="#333">RST</text>
    <line x1="310" y1="460" x2="190" y2="460" stroke="#ff5722" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="510" r="4" fill="#ff0000"/>
    <text x="130" y="515" font-size="12" font-weight="bold" fill="#333">3.3V</text>
    <line x1="310" y1="510" x2="190" y2="510" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5"/>

    <circle cx="320" cy="560" r="4" fill="#999"/>
    <text x="130" y="565" font-size="12" font-weight="bold" fill="#999">IRQ</text>
    <text x="130" y="580" font-size="11" fill="#999">(no conectar)</text>
  </g>

  <!-- ============ RASPBERRY PI PICO W ============ -->
  <g id="pico">
    <!-- Cuerpo de la placa -->
    <rect x="800" y="150" width="350" height="500" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>

    <!-- Título -->
    <text x="975" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      Raspberry Pi Pico W
    </text>

    <!-- USB -->
    <rect x="920" y="135" width="110" height="20" fill="#333" stroke="#000" stroke-width="1" rx="2"/>
    <text x="975" y="150" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">USB</text>

    <!-- Pin GND (pin 3) -->
    <circle cx="820" cy="230" r="4" fill="#000"/>
    <text x="850" y="235" font-size="12" font-weight="bold" fill="#333">Pin 3: GND</text>

    <!-- Pin 1: RST (GP0) -->
    <circle cx="820" cy="260" r="4" fill="#ff5722"/>
    <text x="850" y="265" font-size="12" font-weight="bold" fill="#333">Pin 1: GP0 (RST)</text>

    <!-- Pin 2: SDA (GP1) -->
    <circle cx="820" cy="290" r="4" fill="#ffc107"/>
    <text x="850" y="295" font-size="12" font-weight="bold" fill="#333">Pin 2: GP1 (SDA)</text>

    <!-- Pin 4: SCK (GP2) -->
    <circle cx="820" cy="320" r="4" fill="#4caf50"/>
    <text x="850" y="325" font-size="12" font-weight="bold" fill="#333">Pin 4: GP2 (SCK)</text>

    <!-- Pin 5: MOSI (GP3) -->
    <circle cx="820" cy="350" r="4" fill="#2196f3"/>
    <text x="850" y="355" font-size="12" font-weight="bold" fill="#333">Pin 5: GP3 (MOSI)</text>

    <!-- Pin 6: MISO (GP4) -->
    <circle cx="820" cy="380" r="4" fill="#9c27b0"/>
    <text x="850" y="385" font-size="12" font-weight="bold" fill="#333">Pin 6: GP4 (MISO)</text>

    <!-- Pin 36: 3.3V -->
    <circle cx="820" cy="410" r="4" fill="#ff0000"/>
    <text x="850" y="415" font-size="12" font-weight="bold" fill="#333">Pin 36: 3.3V(OUT)</text>
    <text x="850" y="430" font-size="10" fill="#ff0000">(otro lado de la placa)</text>
  </g>

  <!-- ============ CONEXIONES ============ -->
  <g id="connections" stroke-width="2">
    <!-- SDA (SS) → GP1 -->
    <path d="M 190 210 Q 500 210 820 290" stroke="#ffc107" fill="none" stroke-width="3"/>

    <!-- SCK → GP2 -->
    <path d="M 190 260 Q 500 260 820 320" stroke="#4caf50" fill="none" stroke-width="3"/>

    <!-- MOSI → GP3 -->
    <path d="M 190 310 Q 500 310 820 350" stroke="#2196f3" fill="none" stroke-width="3"/>

    <!-- MISO → GP4 -->
    <path d="M 190 360 Q 500 360 820 380" stroke="#9c27b0" fill="none" stroke-width="3"/>

    <!-- GND → GND -->
    <path d="M 190 410 Q 500 410 820 230" stroke="#000" fill="none" stroke-width="3"/>

    <!-- RST → GP0 -->
    <path d="M 190 460 Q 500 460 820 260" stroke="#ff5722" fill="none" stroke-width="3"/>

    <!-- 3.3V → 3.3V (va a pin 36) -->
    <path d="M 190 510 Q 500 550 820 410" stroke="#ff0000" fill="none" stroke-width="3"/>
  </g>

  <!-- ============ TABLA DE CONEXIONES ============ -->
  <g id="tabla">
    <rect x="50" y="680" width="1100" height="100" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>

    <text x="70" y="705" font-size="13" font-weight="bold" fill="#1a1a1a">RESUMEN DE CONEXIONES:</text>

    <!-- Columnas -->
    <text x="70" y="730" font-size="11" font-weight="bold" fill="#333">RC522</text>
    <text x="200" y="730" font-size="11" font-weight="bold" fill="#333">→ Pico W</text>
    <text x="350" y="730" font-size="11" font-weight="bold" fill="#333">Pin físico</text>
    <text x="550" y="730" font-size="11" font-weight="bold" fill="#333">Cable color</text>

    <!-- Filas -->
    <text x="70" y="755" font-size="11" fill="#333">SDA (SS)</text>
    <text x="200" y="755" font-size="11" fill="#333">GP1</text>
    <text x="350" y="755" font-size="11" fill="#333">2</text>
    <text x="550" y="755" font-size="11" fill="#ffc107" font-weight="bold">● Amarillo</text>

    <text x="70" y="775" font-size="11" fill="#333">SCK</text>
    <text x="200" y="775" font-size="11" fill="#333">GP2</text>
    <text x="350" y="775" font-size="11" fill="#333">4</text>
    <text x="550" y="775" font-size="11" fill="#4caf50" font-weight="bold">● Verde</text>

    <text x="900" y="730" font-size="11" font-weight="bold" fill="#333">Más conexiones →</text>

    <text x="900" y="755" font-size="11" fill="#333">MOSI (GP3, pin 5)</text>
    <text x="900" y="770" font-size="11" fill="#333">MISO (GP4, pin 6)</text>
    <text x="900" y="785" font-size="11" fill="#333">GND (pin 3)</text>
  </g>

  <!-- Leyenda de colores -->
  <g id="leyenda">
    <text x="50" y="690" font-size="10" fill="#666">
      Los 7 cables van de los pines del RC522 a la Pico W siguiendo los colores que se muestran arriba. El cable 3.3V va al pin 36 (en el otro lado de la placa).
    </text>
  </g>
</svg>